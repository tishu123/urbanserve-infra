# ElasticMQ (local Amazon SQS stand-in). Queue names and redrive settings mirror terraform/sqs.tf.
include classpath("application.conf")

node-address {
  protocol = http
  host = "*"
  port = 9324
  context-path = ""
}

rest-sqs {
  enabled = true
  bind-port = 9324
  bind-hostname = "0.0.0.0"
  sqs-limits = strict
}

queues {
  booking-requested-dlq { }
  booking-cancelled-dlq { }
  booking-assignment-dlq { }

  booking-requested {
    defaultVisibilityTimeout = 60 seconds
    receiveMessageWait = 20 seconds
    deadLettersQueue { name = "booking-requested-dlq", maxReceiveCount = 5 }
  }
  booking-cancelled {
    defaultVisibilityTimeout = 60 seconds
    receiveMessageWait = 20 seconds
    deadLettersQueue { name = "booking-cancelled-dlq", maxReceiveCount = 5 }
  }
  booking-assignment {
    defaultVisibilityTimeout = 60 seconds
    receiveMessageWait = 20 seconds
    deadLettersQueue { name = "booking-assignment-dlq", maxReceiveCount = 5 }
  }
}
